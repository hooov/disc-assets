<!doctype html>
<!-- soozybot Twitch profile banner (Creator Dashboard > Settings > Channel > Profile Banner),
     1200x480, rendered at 2400x960. Twitch crops the edges on narrow windows, so the name
     and platforms sit in the middle band. Rendered by render.js (soozybot-twitch-banner). -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Fredoka:wght@600;700&family=Jua&display=block" rel="stylesheet" />
<link rel="stylesheet" href="brand.css" />
<style>
  html, body, .stage { width: 1200px; height: 480px; }
  .blob-a { left: -140px; top: 280px; width: 420px; height: 420px; }
  .blob-b { left: 880px; top: -180px; width: 420px; height: 420px; background: rgba(255,255,255,.2); }
  .mascot { left: 96px; top: 82px; width: 320px; height: 320px; transform: rotate(-6deg); }
  .stack { left: 440px; top: 58px; display: flex; flex-direction: column; align-items: flex-start; }
  .stack .kicker { position: relative; z-index: 1; margin: 0 0 -18px 34px; transform: rotate(-4deg); font-size: 22px; padding: 12px 24px 12px 18px; }
  .stack .name { font-size: 92px; transform: rotate(-2.5deg); }
  .stack .pill { margin: 22px 0 0 40px; font-size: 30px; transform: rotate(2deg); }
  .stack .chips { margin: 22px 0 0 20px; }
  .stack .chips { gap: 12px; }
  .stack .chip { font-size: 19px; padding: 6px 18px 6px 6px; gap: 9px; }
  .stack .tile { width: 38px; height: 38px; border-width: 3px; }
  .bubble { padding: 10px 22px 14px; border-radius: 26px; background: var(--paper); border: 4px solid var(--ink); box-shadow: 5px 6px 0 var(--ink); font-family: var(--display); font-weight: 700; font-size: 28px; white-space: nowrap; }
  .bubble.mono { font-family: var(--mono); font-weight: 500; font-size: 24px; }
</style>
</head>
<body>
<div class="stage" data-bubbles="60,300,40;30,230,22;700,420,26;1150,230,30;880,20,20">
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>
  <svg class="spark" style="left:300px;top:36px;width:40px;height:40px;fill:var(--butter);transform:rotate(-12deg)" viewBox="0 0 24 24"><path d="M12 1c.6 6 4.8 10.4 11 11.5-6.2 1.1-10.4 5.5-11 11.5-.6-6-4.8-10.4-11-11.5C7.2 11.4 11.4 7 12 1z"/></svg>
  <svg class="spark" style="left:1110px;top:200px;width:40px;height:40px;fill:var(--pink);transform:rotate(12deg)" viewBox="0 0 24 24"><path d="M12 1c.6 6 4.8 10.4 11 11.5-6.2 1.1-10.4 5.5-11 11.5-.6-6-4.8-10.4-11-11.5C7.2 11.4 11.4 7 12 1z"/></svg>
  <svg class="moon" style="left:1118px;top:412px;width:48px;height:48px;fill:var(--moon);transform:rotate(-16deg)" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <div class="dot" style="left:70px;top:210px;width:26px;height:26px;background:var(--pink)"></div>
  <div class="hoop" style="left:1090px;top:160px;width:30px;height:30px"></div>
  <span class="twinkle" style="left:460px;top:60px"></span>
  <span class="twinkle" style="left:880px;top:450px"></span>
  <span class="twinkle" style="left:60px;top:420px"></span>
  <svg class="squiggle" style="left:330px;top:410px;width:140px;height:28px;stroke:var(--lilac);transform:rotate(-5deg)" viewBox="0 0 104 20"><path d="M4 10 Q 16.5 1 29 10 T 54 10 T 79 10 T 100 10"/></svg>

  <div class="mascot" data-bot="wink"></div>
  <span class="bubble mono" style="left:960px;top:40px;transform:rotate(5deg)">!commands</span>
  <span class="bubble" style="left:40px;top:26px;transform:rotate(-5deg);background:var(--butter)">beep boop</span>

  <div class="stack">
    <span class="kicker"><i></i>Hello! I'm</span>
    <span class="name">soozybot</span>
    <span class="pill">suzy's chat bot</span>
    <div class="chips">
      <span class="chip"><span class="tile twitch" data-logo="twitch"></span>twitch.tv/suzy</span>
      <span class="chip"><span class="tile kick" data-logo="kick"></span>kick.com/ddooyaa</span>
      <span class="chip"><span class="tile discord" data-logo="discord"></span>discord.gg/suzy</span>
    </div>
  </div>
</div>
<script src="bot.js"></script>
</body>
</html>
