<!doctype html>
<!-- soozybot pixel Twitch panels, 320x100 at 2x with a transparent background: a game text
     box with a square icon. #about, #commands, #suzy, #discord, #kick, #dashboard. The
     pineapple icon is drawn from its pixel grid (pixel.js), 3 CSS px per pixel. Rendered by
     ../render.js (pixel/panels/panel-<name>.png). -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@700&family=Silkscreen&family=Jua&display=block" rel="stylesheet" />
<link rel="stylesheet" href="pixel.css" />
<style>
  html, body { width: 320px; height: 100px; background: transparent; }
  .card { position: absolute; left: 4px; top: 6px; width: 304px; height: 82px; display: flex; align-items: center; gap: 14px; padding: 0 14px 0 13px; border-width: 5px; box-shadow: inset 0 0 0 3px var(--white), inset 0 0 0 5px var(--water), 6px 6px 0 var(--ink); }
  .icon { display: inline-flex; align-items: center; justify-content: center; width: 58px; height: 58px; background: var(--white); border: 4px solid var(--ink); flex: none; }
  .icon svg { display: block; }
  .icon .logo svg, .icon.logo svg { width: 30px; height: 30px; fill: var(--ink); }
  .icon.glyph { font-family: var(--title); font-weight: 700; font-size: 38px; line-height: 1; }
  .words { display: flex; flex-direction: column; gap: 5px; }
  .card .title { font-size: 34px; }
  .card .label { font-size: 11px; color: var(--teal); }
</style>
</head>
<body>
<div class="card box" id="card">
  <span class="icon" id="icon"></span>
  <span class="words"><span class="title" id="title"></span><span class="label" id="sub"></span></span>
</div>
<script>
  // [box colour, icon, title, small line]; icon: "pine", "logo:<name>" or text
  const PANELS = {
    about:     ["var(--gold)", "pine", "about", "suzy's chat bot"],
    commands:  ["var(--white)", "text:!", "commands", "type them in chat"],
    suzy:      ["#F4B4C8", "logo:twitch", "watch suzy", "twitch.tv/suzy"],
    discord:   ["#B9CFF5", "logo:discord", "discord", "discord.gg/suzy"],
    kick:      ["#C9F5B6", "logo:kick", "kick", "kick.com/ddooyaa"],
    dashboard: ["var(--water)", "pine", "bot.suzy.gg", "commands and settings"],
  };
  const [bg, icon, title, sub] = PANELS[location.hash.slice(1)] || PANELS.about;
  const card = document.getElementById("card");
  card.style.background = bg;
  document.getElementById("title").textContent = title;
  document.getElementById("sub").textContent = sub;
  const el = document.getElementById("icon");
  if (icon === "pine") el.dataset.pine = "3";
  else if (icon.startsWith("logo:")) { el.classList.add("logo"); el.dataset.logo = icon.slice(5); }
  else { el.classList.add("glyph"); el.textContent = icon.slice(5); }
</script>
<script src="pixel.js"></script>
<script src="../bot.js"></script>
</body>
</html>
