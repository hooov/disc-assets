<!doctype html>
<!-- soozybot Twitch offline screen (Creator Dashboard > Settings > Stream > Video Player
     Banner), 1920x1080. The bot never streams, so it points people to suzy. Laid out like
     suzy's own offline screen (src/twitch-offline.html): the sleepy mascot in place of her
     card, the moon and stars, and nothing in the top left (Twitch's OFFLINE label) or along
     the bottom (the player's controls). Rendered by render.js (soozybot-twitch-offline). -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Fredoka:wght@600;700&family=Jua&display=block" rel="stylesheet" />
<link rel="stylesheet" href="brand.css" />
<style>
  html, body, .stage { width: 1920px; height: 1080px; }
  .blob-a { left: -220px; top: 660px; width: 720px; height: 720px; }
  .blob-c { left: 820px; top: 880px; width: 420px; height: 420px; background: rgba(255,255,255,.18); }
  .bigmoon { left: 1440px; top: -260px; width: 580px; height: 580px; filter: drop-shadow(10px 12px 0 var(--ink)); }
  .cloud { fill: var(--paper); stroke: var(--ink); stroke-width: 1.1; stroke-linejoin: round; filter: drop-shadow(6px 8px 0 var(--ink)); }
  .z { font-family: var(--display); font-weight: 700; line-height: 1; color: var(--moon); -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; text-shadow: 5px 6px 0 var(--ink); }

  .mascot { left: 170px; top: 230px; width: 600px; height: 600px; transform: rotate(-4deg); }
  .tag { left: 200px; top: 780px; display: flex; flex-direction: column; align-items: flex-start; }
  .hello { position: relative; z-index: 1; margin: 0 0 -20px 42px; padding: 14px 28px; border-radius: 999px; background: var(--paper); border: 4px solid var(--ink); box-shadow: 4px 6px 0 var(--ink); font-family: var(--mono); font-weight: 500; font-size: 22px; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; transform: rotate(-4deg); }
  .tag .name { font-size: 110px; transform: rotate(-3deg); }

  .stack { left: 960px; top: 250px; display: flex; flex-direction: column; align-items: flex-start; gap: 24px; }
  .stack .kicker { transform: rotate(-3deg); margin-left: 30px; }
  .stack .kicker i { background: var(--mint); }
  .big { padding: 12px 36px 22px; border-radius: 34px; background: var(--mint); border: 5px solid var(--ink); box-shadow: 10px 12px 0 var(--ink); font-family: var(--display); font-weight: 700; font-size: 96px; line-height: 1.02; white-space: nowrap; transform: rotate(-2deg); }
  .stack .pill.ko { font-size: 52px; background: var(--butter); transform: rotate(3deg); margin-left: 160px; }
  .stack .chips { flex-direction: column; align-items: flex-start; gap: 14px; margin: -4px 0 0 40px; }
</style>
</head>
<body>
<div class="stage" data-bubbles="110,700,56;70,620,30;860,160,34;1700,520,48;1640,600,26;1560,760,40;760,860,28">
  <div class="blob blob-a"></div>
  <div class="blob blob-c"></div>

  <!-- sleepy moon, top right (as on suzy's offline screen) -->
  <svg class="bigmoon" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="46" fill="var(--moon)" stroke="var(--ink)" stroke-width="1.3" />
    <g fill="var(--crater)" stroke="var(--ink)" stroke-width=".8"><circle cx="30" cy="82" r="4" /><circle cx="74" cy="79" r="6.5" /><circle cx="52" cy="88" r="3" /><circle cx="84" cy="58" r="2.6" /><circle cx="18" cy="64" r="2.2" /></g>
    <g fill="none" stroke="var(--ink)" stroke-width="1.4" stroke-linecap="round"><path d="M36 66 q4 3.6 8 0" /><path d="M56 66 q4 3.6 8 0" /><path d="M47.5 73 q2.5 2 5 0" /></g>
    <ellipse cx="33" cy="73" rx="4.2" ry="2.6" fill="var(--pink)" /><ellipse cx="67" cy="73" rx="4.2" ry="2.6" fill="var(--pink)" />
  </svg>
  <svg class="cloud" style="left:1370px;top:150px;width:210px;height:131px" viewBox="0 0 32 20"><path d="M7 18.5H25a4.8 4.8 0 0 0 .6-9.6A7 7 0 0 0 12.4 6.8 5.9 5.9 0 0 0 7 18.5z"/></svg>
  <svg class="cloud" style="left:1800px;top:262px;width:140px;height:88px" viewBox="0 0 32 20"><path d="M7 18.5H25a4.8 4.8 0 0 0 .6-9.6A7 7 0 0 0 12.4 6.8 5.9 5.9 0 0 0 7 18.5z"/></svg>
  <!-- the mascot sleeps too -->
  <span class="z" style="left:770px;top:120px;font-size:96px;transform:rotate(-12deg)">z</span>
  <span class="z" style="left:710px;top:218px;font-size:70px;transform:rotate(-6deg)">z</span>
  <span class="z" style="left:668px;top:296px;font-size:50px;transform:rotate(4deg)">z</span>

  <svg class="spark" style="left:150px;top:250px;width:50px;height:50px;fill:var(--pink);transform:rotate(-12deg)" viewBox="0 0 24 24"><path d="M12 1c.6 6 4.8 10.4 11 11.5-6.2 1.1-10.4 5.5-11 11.5-.6-6-4.8-10.4-11-11.5C7.2 11.4 11.4 7 12 1z"/></svg>
  <svg class="spark" style="left:1830px;top:430px;width:52px;height:52px;fill:var(--butter);transform:rotate(14deg)" viewBox="0 0 24 24"><path d="M12 1c.6 6 4.8 10.4 11 11.5-6.2 1.1-10.4 5.5-11 11.5-.6-6-4.8-10.4-11-11.5C7.2 11.4 11.4 7 12 1z"/></svg>
  <svg class="spark" style="left:900px;top:130px;width:40px;height:40px;fill:var(--paper);transform:rotate(8deg)" viewBox="0 0 24 24"><path d="M12 1c.6 6 4.8 10.4 11 11.5-6.2 1.1-10.4 5.5-11 11.5-.6-6-4.8-10.4-11-11.5C7.2 11.4 11.4 7 12 1z"/></svg>
  <svg class="moon" style="left:1640px;top:900px;width:64px;height:64px;fill:var(--moon);transform:rotate(-18deg)" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <div class="dot" style="left:96px;top:560px;width:34px;height:34px;background:var(--mint)"></div>
  <div class="dot" style="left:1840px;top:700px;width:30px;height:30px;background:var(--pink)"></div>
  <div class="hoop" style="left:420px;top:160px;width:40px;height:40px"></div>
  <div class="hoop" style="left:1760px;top:560px;width:34px;height:34px"></div>
  <span class="twinkle" style="left:880px;top:250px"></span>
  <span class="twinkle" style="left:70px;top:420px"></span>
  <span class="twinkle" style="left:1560px;top:960px"></span>
  <span class="twinkle" style="left:1250px;top:250px"></span>
  <svg class="squiggle" style="left:240px;top:190px;width:150px;height:30px;stroke:var(--pink);transform:rotate(-6deg)" viewBox="0 0 104 20"><path d="M4 10 Q 16.5 1 29 10 T 54 10 T 79 10 T 100 10"/></svg>
  <svg class="squiggle" style="left:1380px;top:930px;width:170px;height:32px;stroke:var(--lilac);transform:rotate(5deg)" viewBox="0 0 104 20"><path d="M4 10 Q 16.5 1 29 10 T 54 10 T 79 10 T 100 10"/></svg>

  <div class="mascot" data-bot="sleep"></div>
  <div class="tag">
    <span class="hello">Hello! my name is</span>
    <span class="name">soozybot</span>
  </div>

  <div class="stack">
    <span class="kicker"><i></i>I'm a bot</span>
    <span class="big">i don't stream!</span>
    <span class="pill ko">저는 봇이에요!</span>
    <span class="kicker" style="margin-top:6px"><i></i>catch suzy live</span>
    <div class="chips">
      <span class="chip"><span class="tile twitch" data-logo="twitch"></span>twitch.tv/suzy</span>
      <span class="chip"><span class="tile kick" data-logo="kick"></span>kick.com/ddooyaa</span>
      <span class="chip"><span class="tile discord" data-logo="discord"></span>discord.gg/suzy</span>
    </div>
  </div>
</div>
<script src="bot.js"></script>
</body>
</html>
